*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Spectral,Georgia,serif;margin:.2em 0;line-height:1.2}
#app{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;margin:8px 0;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--uv)}
.btn.main{background:var(--uv);border-color:var(--uv);color:#fff;text-align:center;font-weight:600}
.btn.ok{border-color:var(--ok)}.btn.bad{border-color:var(--bad)}

.q{color:var(--uv);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}
.mute{color:var(--mute);font-size:14px}.stars{font-size:26px;color:var(--uv);letter-spacing:2px}
.dishes{display:flex;gap:8px;flex-wrap:wrap}.dish{width:96px;text-align:center;font-size:12px}

.pat{letter-spacing:2px}
.big{font-size:28px}

{y:"Вена, 1847",t:"Дело первой клиники",br:"Венская городская больница. В Первой акушерской клинике от родильной горячки умирает каждая десятая роженица. Во Второй — гораздо реже. Вам предстоит выяснить почему.",
ppl:[["Акушерка Второй клиники","Мы принимаем роды сами. Покойников не вскрываем — это дело студентов."],["Студент-медик","Утром у нас секционная, потом сразу обход родильниц. Руки? Вытираем о фартук."],["Проф. Клейн","Виновны миазмы и теснота. Прошу не искать в моей клинике то, чего нет."]],

else if(S.st==3)return game(h);
else if(S.st==4){h+='<h3>Ваша версия</h3>';c.ver.forEach(function(v,i){h+='<button class="btn" onclick="pick('+i+')">'+v[0]+'</button>'})}
else if(S.st==5){var v=S.v;h+='<div class="card"><h3 style="color:var(--'+(v[1]?'ok':'bad')+')">'+(v[1]?"Версия верна":"Версия неверна. Пациент потерян")+'</h3><p>'+v[2]+'</p></div><button class="btn main" onclick="nextCase()">'+(S.c<4?"К следующему делу":"К итогам")+'</button>'}
$(h)}
function ask(k){S.asked[k]=1;beep(520,.15);render()}
function exp(h,c){var T=[["Без обработки",120,"#a05a2c"],["Мытьё мылом, 40–60 с",35,"#c28a3a"],["Спиртовой антисептик, 30 с",3,"#d6c27a"]];
h+='<div class="card"><h3>Эксперимент: отпечаток пальцев на чашке Петри</h3><p class="mute">Выберите способ обработки, посмотрите на рост колоний. Значения условные, соотношение отражает данные исследований.</p><div class="dishes">';
T.forEach(function(t,i){var d="";if(S.tried[i]){for(var j=0;j<t[1];j++){var a=j*2.4,r=Math.sqrt(j/t[1])*40;d+='<circle cx="'+(48+r*Math.cos(a)).toFixed(1)+'" cy="'+(48+r*Math.sin(a)).toFixed(1)+'" r="1.7" fill="'+t[2]+'"/>'}}
h+='<div class="dish"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="46" fill="#f2e3b3" opacity=".35" stroke="#888"/>'+d+'</svg><button class="btn" style="text-align:center;padding:6px" onclick="S.tried['+i+']=1;beep('+(300+i*150)+',.2);render()">'+t[0]+'</button>'+(S.tried[i]?'<b>~'+t[1]+' КОЕ</b>':'')+'</div>'});
var all=S.tried[0]&&S.tried[1]&&S.tried[2];h+='</div><p class="mute">'+c.lab[2]+'</p></div><button class="btn main" '+(all?'':'disabled')+' onclick="S.st=3;S.ord=[];S.err=0;render()">'+(all?'К мини-игре: техника ВОЗ':'Проверьте все три способа')+'</button>';$(h)}
function game(h){var ord=S.ord;h+='<div class="card"><h3>Техника обработки рук (ВОЗ)</h3><p class="mute">Нажимайте этапы в правильном порядке.</p>';
STEPS.map(function(s,i){return[s,i]}).sort(function(a,b){return((a[1]*7+3)%6)-((b[1]*7+3)%6)}).forEach(function(p){var d=ord.indexOf(p[1])>=0;h+='<button class="btn '+(d?'ok':'')+'" '+(d?'disabled':'')+' onclick="gs('+p[1]+')">'+(d?(ord.indexOf(p[1])+1)+". ":"")+p[0]+'</button>'});$(h+'</div>')}
function gs(i){if(i==S.ord.length){S.ord.push(i);beep(660,.12)}else{beep(150,.3,"sawtooth");if(!S.err){S.err=1;S.lost++;S.log.push("Ошибка в технике: потерян пациент")}}
if(S.ord.length==6){S.st=4;beep(880,.3)}render()}
function pick(i){var v=CASES[S.c].ver[i];S.v=v;if(v[1]){S.ok++;beep(740,.3)}else{S.lost++;beep(150,.4,"sawtooth")}S.st=5;render()}
function nextCase(){S.c++;S.st=0;S.asked={};render()}
function end(){var st=Math.max(1,Math.min(5,5-S.lost)),sv0=ld();if((sv0.best||0)<st){sv0.best=st;sv(sv0)}
var E=st==5?"Безупречное расследование. Все пациенты спасены, а мытьё рук стало правилом отделения.":st>=3?"Часть пациентов потеряна, но вы нашли главное звено цепи — руки.":"Много потерь. Вернитесь к делам Земмельвейса и Листера и попробуйте ещё раз.";
$('<div class="card"><h1>Итоги</h1><div class="stars big">'+"★".repeat(st)+"☆".repeat(5-st)+'</div><h2>'+RANKS[Math.min(3,Math.max(0,st-2))]+'</h2><p>Спасено пациентов: '+st+' из 5. Верных версий: '+S.ok+' из 5.</p><p>'+E+'</p><p class="mute">Главный вывод: цепь передачи прерывается на руках. Путь: мытьё с хлорной водой, затем карболка, асептика, спиртовые антисептики.</p><button class="btn main" onclick="start()">Сыграть заново</button></div>')}
start();
</script></body></html>
